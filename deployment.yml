apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: netflix

  template:
    metadata:
      labels:
        app: netflix

    spec:
      containers:
      - name: netflix-container
        image: <ECR_URL>/netflix-devops:latest

        ports:
        - containerPort: 3000
